# Electrostatics Benchmark Configuration
# =======================================
# Per-module config following upstream pattern.
# Two systems (CsCl, NH3) × three scaling modes.
#
# Usage (run from the repository root):
#   RESULT_DIR="$BENCHMARK_SCRATCH/results/manual-el-run"
#   python -m benchmarks.interactions.electrostatics.benchmark_electrostatics_suite \
#       --config benchmarks/interactions/electrostatics/benchmark_config.yaml \
#       --output-dir "$RESULT_DIR"

# -----------------------------------------------------------------------------
# Global Parameters
# -----------------------------------------------------------------------------
parameters:
  warmup_runs: 3
  timing_runs: 10
  timing_batches: 5
  profile_components: false
  # Cap PME's real-space neighbor-list radius. Direct Ewald keeps the
  # automatically balanced real- and reciprocal-space cutoffs.
  max_real_space_cutoff: 9.0

# -----------------------------------------------------------------------------
# Systems
# -----------------------------------------------------------------------------
systems:
  cscl:
    enabled: true
    atom_counts: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
    constant_atoms_sizes: [250, 8192]   # CsCl valid: 2*5^3=250, 2*16^3=8192
    # Exact B2 replica grids shared by system-size and constant-workload scaling.
    # The longest cell axis stays first so the PME FFT orientation is fixed.
    replication_factors:
      128: [4, 4, 4]
      256: [8, 4, 4]
      512: [8, 8, 4]
      1024: [8, 8, 8]
      2048: [16, 8, 8]
      4096: [16, 16, 8]
      8192: [16, 16, 16]
      16384: [32, 16, 16]
      32768: [32, 32, 16]
      65536: [32, 32, 32]
      131072: [64, 32, 32]

  nh3:
    enabled: true
    pdb_dir: ../../nh3
    atom_counts: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
    constant_atoms_sizes: [256, 8192]

# -----------------------------------------------------------------------------
# Scaling Modes
# -----------------------------------------------------------------------------
scaling:
  system_size:
    enabled: true
    batch_size: 1

  constant_workload:
    enabled: true
    target_atoms: 131072
    batch_sizes:
      cscl:
        128: 1024       # 128 x 1024 = 131072
        256: 512        # 256 x 512 = 131072
        512: 256        # 512 x 256 = 131072
        1024: 128       # 1024 x 128 = 131072
        2048: 64        # 2048 x 64 = 131072
        4096: 32        # 4096 x 32 = 131072
        8192: 16        # 8192 x 16 = 131072
        16384: 8        # 16384 x 8 = 131072
        32768: 4        # 32768 x 4 = 131072
        65536: 2        # 65536 x 2 = 131072
        131072: 1       # 131072 x 1 = 131072
      nh3:
        128: 1024
        256: 512
        512: 256
        1024: 128
        2048: 64
        4096: 32
        8192: 16
        16384: 8
        32768: 4
        65536: 2
        131072: 1

  batch_scaling:
    enabled: true
    max_total_atoms: 131072

# -----------------------------------------------------------------------------
# Methods
# -----------------------------------------------------------------------------
methods:
  - name: pme
    enabled: true
    description: "Particle Mesh Ewald - recommended for large systems"
    spline_order: 5

  - name: ewald
    enabled: true
    description: "Direct Ewald summation"

# Accuracy levels to benchmark
accuracies: [1.0e-4, 1.0e-6]

# Every row evaluates energy and derives forces plus charge gradients through
# framework autograd. This is one workload, not a configurable row dimension.

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  base_dir: ../../benchmark-results
