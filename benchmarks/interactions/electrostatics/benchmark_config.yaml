# Electrostatics Benchmark Configuration
# =======================================
# Per-module config following upstream pattern.
# Two systems (CsCl, NH3) × three scaling modes.
#
# Usage:
#   cd benchmarks/interactions/electrostatics
#   python benchmark_electrostatics.py --config benchmark_config.yaml
#   python benchmark_electrostatics.py --config benchmark_config.yaml --output-dir ../../../docs/benchmarks/benchmark_results

# -----------------------------------------------------------------------------
# Global Parameters
# -----------------------------------------------------------------------------
parameters:
  warmup_runs: 3
  timing_runs: 20
  timing_mode: batch

# -----------------------------------------------------------------------------
# Systems
# -----------------------------------------------------------------------------
systems:
  cscl:
    enabled: true
    atom_counts: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
    constant_atoms_sizes: [250, 8192]   # CsCl valid: 2*5^3=250, 2*16^3=8192

  nh3:
    enabled: true
    pdb_dir: ../../nh3
    constant_atoms_sizes: [256, 8192]

# -----------------------------------------------------------------------------
# Scaling Modes
# -----------------------------------------------------------------------------
scaling:
  system_size:
    enabled: true
    batch_size: 1

  constant_workload:
    enabled: true
    target_atoms: 131072

  batch_scaling:
    enabled: true
    max_total_atoms: 131072

# -----------------------------------------------------------------------------
# Methods
# -----------------------------------------------------------------------------
methods:
  - name: pme
    enabled: true
    description: "Particle Mesh Ewald - recommended for large systems"
    spline_order: 4

  - name: ewald
    enabled: true
    description: "Direct Ewald summation"

# Accuracy levels to benchmark
accuracies: [1.0e-4, 1.0e-6]

# Whether to benchmark charge gradient computation
compute_charge_gradients: [false, true]

# OOM prevention: skip high accuracy for large systems
skip_accuracy_for_large:
  1.0e-6: 131072                   # Skip 1e-6 for systems >= 128k atoms

# Max atoms for scaling benchmarks
max_atoms: 131072

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  base_dir: ../../benchmark-results
  include_gpu_sku: true
