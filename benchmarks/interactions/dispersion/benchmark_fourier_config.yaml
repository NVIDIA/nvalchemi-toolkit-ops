# Configuration for the FourierD3 benchmarks.
#
# Same matrix as the DFT-D3 benchmark: two systems x three scaling modes, one standardized
# CSV per pair. Rows are fixed-configuration throughput; the mesh follows a fixed spacing
# and the dftd3 rows use fixed cutoffs, with no accuracy relationship established between
# them for these systems.

parameters:
  # 6.0 is the common MLFF cutoff and is NOT converged for dispersion. 15.0 and 20.0 are
  # the range where the real-space sum approaches convergence for a condensed phase.
  real_space_cutoffs: [6.0, 15.0, 20.0]

  timing_runs: 10
  warmup_runs: 3
  max_total_atoms: 131072

runtime:
  backend: torch

# -----------------------------------------------------------------------------
# Systems
# -----------------------------------------------------------------------------
# FourierD3 is periodic only, so both systems are used with their cells.
systems:
  cscl:
    enabled: true
    atom_counts: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
    constant_atoms_sizes: [250, 8192]   # CsCl valid: 2*5^3=250, 2*16^3=8192

  nh3:
    enabled: true
    pdb_dir: ../../nh3
    atom_counts: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
    constant_atoms_sizes: [256, 8192]

# -----------------------------------------------------------------------------
# Scaling Modes
# -----------------------------------------------------------------------------
scaling:
  system_size:
    enabled: true
    batch_size: 1

  constant_workload:
    enabled: true
    target_atoms: 32768

  batch_scaling:
    enabled: true
    max_total_atoms: 32768

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  base_dir: benchmarks/results
