# DFT-D3 Dispersion Benchmark Configuration
# ==========================================
# Per-module config following upstream pattern.
# Two systems (CsCl, NH3) × three scaling modes.
#
# Usage:
#   cd benchmarks/interactions/dispersion
#   python benchmark_dftd3.py --config benchmark_config.yaml
#   python benchmark_dftd3.py --config benchmark_config.yaml --output-dir ../../../docs/benchmarks/benchmark_results

# -----------------------------------------------------------------------------
# Global Parameters
# -----------------------------------------------------------------------------
parameters:
  cutoffs: [15.0, 25.0]            # Angstroms (converted to Bohr internally)
  warmup_runs: 3
  timing_runs: 20
  timing_mode: batch

# -----------------------------------------------------------------------------
# DFT-D3(BJ) Functional Parameters (PBE)
# -----------------------------------------------------------------------------
dftd3_parameters:
  a1: 0.4145
  a2: 4.8593
  s6: 1.0
  s8: 1.2177
  k1: 16.0
  k3: -4.0

# D3 reference parameters file (auto-downloaded on first use)
params_path: ~/.cache/nvalchemiops/dftd3_parameters.pt

# -----------------------------------------------------------------------------
# Systems
# -----------------------------------------------------------------------------
systems:
  cscl:
    enabled: true
    atom_counts: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
    constant_atoms_sizes: [250, 8192]   # CsCl valid: 2*5^3=250, 2*16^3=8192

  nh3:
    enabled: true
    pdb_dir: ../../nh3
    constant_atoms_sizes: [256, 8192]

# -----------------------------------------------------------------------------
# Scaling Modes
# -----------------------------------------------------------------------------
scaling:
  system_size:
    enabled: true
    batch_size: 1

  constant_workload:
    enabled: true
    target_atoms: 131072

  batch_scaling:
    enabled: true
    max_total_atoms: 131072

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  base_dir: ../../benchmark-results
  include_gpu_sku: true
