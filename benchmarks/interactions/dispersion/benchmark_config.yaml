# DFT-D3 Dispersion Benchmark Configuration
# ==========================================
# Per-module config following upstream pattern.
# Two systems (CsCl, NH3) × three scaling modes.
#
# Usage (run from the repository root):
#   RESULT_DIR="$BENCHMARK_SCRATCH/results/manual-d3-run"
#   python -m benchmarks.interactions.dispersion.benchmark_dftd3 \
#       --config benchmarks/interactions/dispersion/benchmark_config.yaml \
#       --output-dir "$RESULT_DIR"

# -----------------------------------------------------------------------------
# Global Parameters
# -----------------------------------------------------------------------------
parameters:
  cutoffs: [15.0, 25.0]            # Angstroms (converted to Bohr internally)
  warmup_runs: 3
  timing_runs: 10

# -----------------------------------------------------------------------------
# DFT-D3(BJ) Functional Parameters (PBE)
# -----------------------------------------------------------------------------
dftd3_parameters:
  a1: 0.4289
  a2: 4.4407
  s8: 0.7875

# D3 reference parameters file (auto-downloaded on first use).
# The default ~/.cache prefix honors XDG_CACHE_HOME when set.
params_path: ~/.cache/nvalchemiops/dftd3_parameters.pt

# -----------------------------------------------------------------------------
# Methods
# -----------------------------------------------------------------------------
methods:
  - name: dftd3
    enabled: true
    description: "DFT-D3 energy, analytical forces, and coordination numbers"

# -----------------------------------------------------------------------------
# Systems
# -----------------------------------------------------------------------------
systems:
  cscl:
    enabled: true
    atom_counts: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
    constant_atoms_sizes: [250, 8192]   # CsCl valid: 2*5^3=250, 2*16^3=8192

  nh3:
    enabled: true
    pdb_dir: ../../nh3
    atom_counts: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
    constant_atoms_sizes: [256, 8192]

# -----------------------------------------------------------------------------
# Scaling Modes
# -----------------------------------------------------------------------------
scaling:
  system_size:
    enabled: true
    batch_size: 1

  constant_workload:
    enabled: true
    target_atoms: 131072

  batch_scaling:
    enabled: true
    max_total_atoms: 131072

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  base_dir: ../../benchmark-results
