name: "Docs"

# runs on demand as well as after a successful CI run on main branch
# this means we only try and build docs if and only if changes to main
# aren't going to poison them
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # The head branch of the triggering run. CI also runs on the copy-pr-bot's
    # ``pull-request/*`` branches and in the merge queue; neither should publish.
    branches: [main]

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

env:
  UV_CACHE_DIR: /tmp/uv-cache
  WARP_CACHE_PATH: /tmp/warp-cache
  MPLCONFIGDIR: /tmp/matplotlib
  RUN_EXAMPLES: "True"
  BENCHMARK_ALLOW_MIXED_SNAPSHOT: "1"
  BENCHMARK_PLOT_JOBS: auto

jobs:
  build:
    name: Build versioned documentation
    # ``workflow_run`` fires on completion whatever the conclusion
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # cancel-in-progress makes it so that newer PRs that land around the same time
    # in main will supercede older ones, so we don't redundantly
    # try and build docs
    concurrency:
      group: ${{ github.workflow }}-build
      cancel-in-progress: true
    runs-on: linux-amd64-gpu-h100-latest-1
    timeout-minutes: 480
    permissions:
      contents: read
      pages: read
    env:
      SMV_SITE_PACKAGES_V0_1_0: /tmp/docs-deps/warp-1.9.0
      SMV_SITE_PACKAGES_V0_2_0: /tmp/docs-deps/warp-1.10.1
      SMV_SITE_PACKAGES_V0_3_0: /tmp/docs-deps/warp-1.11.0
      SMV_SITE_PACKAGES_V0_3_1: /tmp/docs-deps/warp-1.11.0
      SMV_SITE_PACKAGES_0_3_0_RC: /tmp/docs-deps/warp-1.11.0
      SMV_SITE_PACKAGES_0_3_1_RC: /tmp/docs-deps/warp-1.11.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Site-wide tooling always comes from main. The fetched tags and RC
          # branches remain available to sphinx-multiversion as content refs.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup UV
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --extra torch --extra jax

      - name: Install historical Warp versions
        run: |
          uv pip install --target "$SMV_SITE_PACKAGES_V0_1_0" --no-deps "warp-lang==1.9.0"
          uv pip install --target "$SMV_SITE_PACKAGES_V0_2_0" --no-deps "warp-lang==1.10.1"
          uv pip install --target "$SMV_SITE_PACKAGES_V0_3_0" --no-deps "warp-lang==1.11.0"

      - name: Build versioned documentation
        run: uv run --no-sync sphinx-multiversion docs site -j=1

      - name: Add site entry point
        run: |
          cp docs/pages-index.html site/index.html
          uv run --no-sync python docs/generate_pages_redirects.py site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    # The opposite policy to the build: a deployment that is cancelled part way
    # through leaves the published site in whatever state it had reached, so
    # these queue instead of superseding each other.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
