# Weekly UV Lock Upgrade Workflow
#
# This workflow runs weekly to upgrade all dependencies in uv.lock
# and creates a pull request if there are changes.
#
# TRIGGERS:
# - Scheduled runs (weekly on Monday at 9 AM UTC)

name: "uv-weekly-sync"

on:
  schedule:
    - cron: "0 9 * * 1" # Runs at 9 AM UTC every Monday

jobs:
  uv-lock-upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run uv lock --upgrade
        run: uv lock --upgrade

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet uv.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to uv.lock"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in uv.lock"
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: upgrade uv.lock dependencies"
          title: "Weekly `uv` lockfile upgrade"
          body: |
            This PR was automatically created by the weekly uv lock upgrade workflow.

            ## Changes
            - Upgraded all dependencies in `uv.lock` using `uv lock --upgrade`

            ## Review
            Please review the dependency changes and ensure all tests pass before merging.
          branch: ci/uv-lock-upgrade
          delete-branch: true
          labels: dependencies
